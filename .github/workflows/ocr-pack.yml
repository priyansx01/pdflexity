name: OCR feature pack

# Builds the self-contained PaddleOCR worker (PyInstaller onedir) on a Python
# 3.12 Windows runner and publishes it as a GitHub release asset that the app
# downloads on demand. Run via the Actions tab (workflow_dispatch) or by pushing
# an `ocr-pack-v*` tag. After it runs, set OCR_PACK_URL / OCR_PACK_SHA256 in
# src-tauri/src/commands/features.rs to match the published asset.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ocr-pack-v1)"
        required: true
        default: "ocr-pack-v1"
  push:
    tags: ["ocr-pack-v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install OCR + build deps
        working-directory: services/ocr-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build the worker (PyInstaller onedir)
        working-directory: services/ocr-engine
        shell: pwsh
        run: ./build.ps1

      - name: Package + checksum
        shell: pwsh
        run: |
          $src = "src-tauri/resources/ocr/pdflexity-ocr-worker"
          if (-not (Test-Path $src)) { throw "worker onedir not found at $src" }
          Compress-Archive -Path $src -DestinationPath pdflexity-ocr-worker-win-x64.zip -Force
          $hash = (Get-FileHash -Algorithm SHA256 pdflexity-ocr-worker-win-x64.zip).Hash.ToLower()
          "$hash  pdflexity-ocr-worker-win-x64.zip" | Out-File -Encoding ascii pdflexity-ocr-worker-win-x64.zip.sha256
          Write-Host "SHA256: $hash"

      - name: Resolve tag
        id: tag
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") {
            $t = $env:GITHUB_REF -replace "refs/tags/", ""
          } else {
            $t = "${{ github.event.inputs.tag }}"
          }
          "tag=$t" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OCR feature pack ${{ steps.tag.outputs.tag }}
          files: |
            pdflexity-ocr-worker-win-x64.zip
            pdflexity-ocr-worker-win-x64.zip.sha256
