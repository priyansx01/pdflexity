name: OCR feature pack

# Builds the self-contained PaddleOCR worker (PyInstaller onedir) on a Python
# 3.12 runner for each OS and publishes one zip per platform as a GitHub release
# asset that the app downloads on demand. Run via the Actions tab
# (workflow_dispatch) or by pushing an `ocr-pack-v*` tag. After it runs, set the
# per-platform URLs / SHA-256s in src-tauri/src/commands/features.rs.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. ocr-pack-v1)"
        required: true
        default: "ocr-pack-v1"
  push:
    tags: ["ocr-pack-v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: pdflexity-ocr-worker-win-x64.zip
          - os: macos-13 # Intel x64 runner
            asset: pdflexity-ocr-worker-macos-x64.zip
          - os: ubuntu-latest
            asset: pdflexity-ocr-worker-linux-x64.zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # 3.11 (not 3.12): paddlex pins pandas<=1.5.3, which has no cp312
          # wheel and fails to build from source — 3.11 has a prebuilt wheel.
          python-version: "3.11"

      - name: Install OCR + build deps
        working-directory: services/ocr-engine
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build worker (Windows)
        if: runner.os == 'Windows'
        working-directory: services/ocr-engine
        shell: pwsh
        run: ./build.ps1

      - name: Build worker (Unix)
        if: runner.os != 'Windows'
        working-directory: services/ocr-engine
        shell: bash
        run: bash build.sh

      - name: Package + checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $src = "src-tauri/resources/ocr/pdflexity-ocr-worker"
          if (-not (Test-Path $src)) { throw "worker onedir not found at $src" }
          Compress-Archive -Path $src -DestinationPath ${{ matrix.asset }} -Force
          $hash = (Get-FileHash -Algorithm SHA256 ${{ matrix.asset }}).Hash.ToLower()
          "$hash  ${{ matrix.asset }}" | Out-File -Encoding ascii ${{ matrix.asset }}.sha256
          Write-Host "SHA256: $hash"

      - name: Package + checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          src="src-tauri/resources/ocr/pdflexity-ocr-worker"
          [ -d "$src" ] || { echo "worker onedir not found at $src"; exit 1; }
          ( cd "$(dirname "$src")" && zip -r -q "$OLDPWD/${{ matrix.asset }}" "$(basename "$src")" )
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"
          else
            shasum -a 256 "${{ matrix.asset }}" | tee "${{ matrix.asset }}.sha256"
          fi

      - name: Resolve tag
        id: tag
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: OCR feature pack ${{ steps.tag.outputs.tag }}
          files: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
