[package]
name = "pdflexity"
version = "1.0.0"
description = "Privacy-first PDF toolkit — Tauri + Rust + Go engine"
authors = ["pdflexity"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"

# Async runtime + process management (Go engine bridge)
tokio = { version = "1", features = ["io-util", "process", "sync", "rt-multi-thread", "macros", "fs", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Filesystem helpers
tempfile = "3"

# Encoding (PDF results returned as base64 to match frontend contract)
base64 = "0.22"

# PDF compression (pure Rust: lopdf structural ops + image crate re-encoding)
lopdf = "0.36"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
flate2 = "1"

# Open URLs in the user's default browser (replaces Electron shell.openExternal)
open = "5"

# On-demand feature packs: download (reqwest), verify (sha2), extract (zip)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
futures-util = "0.3"
sha2 = "0.10"
zip = { version = "2", default-features = false, features = ["deflate"] }

# Misc
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
