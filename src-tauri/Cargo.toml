[package]
name = "pdflexity"
version = "1.0.0"
description = "Privacy-first PDF toolkit — Tauri + Rust + Go engine"
authors = ["pdflexity"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-log = "2"

# Async runtime + process management (Go engine bridge)
tokio = { version = "1", features = ["io-util", "process", "sync", "rt-multi-thread", "macros", "fs", "time"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Filesystem helpers
tempfile = "3"

# Encoding (PDF results returned as base64 to match frontend contract)
base64 = "0.22"

# Open URLs in the user's default browser (replaces Electron shell.openExternal)
open = "5"

# Misc
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
